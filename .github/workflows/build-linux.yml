
name: Build EvtxECmd for Linux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run tests
        run: dotnet test evtx.Test/evtx.Test.csproj -c Release

      - name: Build Linux x64
        run: |
          dotnet publish EvtxECmd/EvtxECmd.csproj \
            -c Release \
            -f net10.0 \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -o dist/EvtxECmd

          cp -r evtx/Maps dist/EvtxECmd/Maps
          cp LICENSE dist/EvtxECmd/LICENSE

      - name: Smoke test
        run: ./dist/EvtxECmd/EvtxECmd --help

      - name: Package
        run: |
          tar -czf EvtxECmd-linux-x64.tar.gz \
            -C dist EvtxECmd

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: EvtxECmd-linux-x64
          path: EvtxECmd-linux-x64.tar.gz
          if-no-files-found: error

      # Enable only after verifying build artifacts.
      # Also change permissions.contents to write.
      #
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "linux-${{ github.run_number }}" \
            EvtxECmd-linux-x64.tar.gz \
            --target "${{ github.sha }}" \
            --title "EvtxECmd Linux (Unofficial)" \
            --notes "Linux x64 build of EvtxECmd."
